<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>歌词中继</title>
    <style>
      :root {
        --bg: #0b0d11;
        --panel: #12151c;
        --text: #eef1f5;
        --muted: #8b93a1;
        --line: rgba(255, 255, 255, 0.07);
        --ok: #3dd68c;
        --off: #ff7b72;
        --accent: #7aa2ff;
        --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
          'Hiragino Sans GB', system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        padding: 24px 18px calc(28px + env(safe-area-inset-bottom));
      }
      .app { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
      .sub { color: var(--muted); font-size: 13px; margin-top: 4px; margin-bottom: 4px; }
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
        width: fit-content;
      }
      .pill.on { color: var(--ok); background: rgba(61,214,140,.12); border: 1px solid rgba(61,214,140,.25); }
      .pill.off { color: var(--off); background: rgba(255,123,114,.1); border: 1px solid rgba(255,123,114,.22); }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px;
      }
      label { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
      input {
        background: #171b24; border: 1px solid var(--line); border-radius: 10px;
        color: var(--text); padding: 14px 12px; font-size: 16px; font-family: inherit;
        width: 100%;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        border: 0; border-radius: 12px; background: var(--accent); color: #0b0d11;
        font: 650 15px/1 var(--font); padding: 14px; width: 100%; cursor: pointer;
      }
      button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
      button:active { transform: scale(0.98); }
      .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
      .hint code { color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
      #log {
        min-height: 40px; font-size: 12px; color: var(--muted); line-height: 1.5;
        white-space: pre-wrap;
      }
      .section-title {
        font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div>
        <h1>歌词中继</h1>
        <p class="sub">手机放歌 · Mac 只看词 · 极简链路</p>
        <div id="pill" class="pill off"><span class="dot"></span>未连接 Mac</div>
      </div>

      <div class="card">
        <div class="section-title">连接 Mac</div>
        <label>Mac IP
          <input id="ip" type="url" inputmode="decimal" placeholder="172.20.10.2" autocomplete="off" />
        </label>
        <label>端口
          <input id="port" type="number" value="8765" />
        </label>
        <button id="test" class="ghost" type="button">测试连接</button>
        <p id="log">填入 Mac 设置页显示的地址。手机与 Mac 需在同一热点。</p>
      </div>

      <div class="card">
        <div class="section-title">演示推送</div>
        <p class="hint">先在 Mac 打开应用，再点下面按钮看悬浮窗是否跟行。</p>
        <button id="demoPush" type="button">推送演示曲目</button>
      </div>

      <div class="card">
        <div class="section-title">手机 App 保活</div>
        <p class="hint">
          1. 安装 <code>PhoneLyricsRelay</code><br />
          2. 设置 → 通知使用权 → 歌词中继<br />
          3. 电池 → 不受限制 / 关闭优化<br />
          4. 启动中继后锁屏，通知栏应保持「歌词中继」
        </p>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const saved = localStorage.getItem('relay');
      if (saved) {
        try {
          const s = JSON.parse(saved);
          if (s.ip) $('ip').value = s.ip;
          if (s.port) $('port').value = s.port;
        } catch {}
      }

      function endpoint(path) {
        const ip = $('ip').value.trim();
        const port = $('port').value.trim() || '8765';
        if (!ip) throw new Error('请填写 Mac IP');
        localStorage.setItem('relay', JSON.stringify({ ip, port }));
        return `http://${ip}:${port}${path}`;
      }

      function setPill(on, text) {
        $('pill').className = 'pill ' + (on ? 'on' : 'off');
        $('pill').innerHTML = `<span class="dot"></span>${text}`;
      }

      $('test').addEventListener('click', async () => {
        $('log').textContent = '测试中…';
        try {
          const res = await fetch(endpoint('/api/status'), { signal: AbortSignal.timeout(4000) });
          const data = await res.json();
          setPill(true, 'Mac 在线');
          $('log').textContent = `成功 · 端口 ${data.port} · ${(data.addresses || []).join(', ')}`;
        } catch (e) {
          setPill(false, '未连接 Mac');
          $('log').textContent = '失败：' + e.message + '。确认 Mac 应用已启动、端口一致、同一热点。';
        }
      });

      $('demoPush').addEventListener('click', async () => {
        $('log').textContent = '推送中…';
        try {
          const res = await fetch(endpoint('/api/now-playing'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: '晴天',
              artist: '周杰伦',
              album: '叶惠美',
              durationMs: 269000,
              positionMs: 8000,
              state: 'playing',
              source: 'web-demo',
              ts: Date.now(),
            }),
          });
          const data = await res.json();
          setPill(true, '已推送演示');
          $('log').textContent = data.ok ? '已发送。请看 Mac 悬浮歌词。' : '推送失败';
        } catch (e) {
          setPill(false, '推送失败');
          $('log').textContent = e.message;
        }
      });
    </script>
  </body>
</html>
